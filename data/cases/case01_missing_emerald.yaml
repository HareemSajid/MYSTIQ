hints:
  - >-
    Dr. Watson: "Holmes would first ask what each person actually saw, not what they supposed. Who truly handled the
    emerald, and who saw it last? Miss Ashford's guess is not evidence."
  - >-
    Dr. Watson: "There is a quarter of an hour at table when the hall was unobserved. Set the caretaker's own account of
    where he stood beside the dinner timeline and Miss Bennett's trip to the cloakroom."
  - >-
    Dr. Watson: "Since only two keys exist and his lordship kept his own, ask who could have used the other. Compare the
    caretaker's claim about the key cabinet with Mr. Dunmore's ledger. Whose claimed movements do not match the
    record?"
solution:
  culprit: whitmore
  what: >-
    James Whitmore left his post in the hall, took the spare study key from the cabinet, entered the locked study,
    took the emerald, relocked the door and returned the key — then lied about all of it.
  when: Between about 8:20 PM and 8:55 PM, while the household was at dinner.
  sequence:
    - "7:15 PM — Lord Ashford shows the emerald to Eleanor, Richard and Clara; he alone handles it."
    - "7:30 PM — Lord Ashford returns it to its case and locks the study with his own key."
    - "8:10 PM — A note arrives for Whitmore arranging a handover at the mews gate at ten."
    - "8:20 PM — Whitmore opens the key cabinet and takes the spare study key (Dunmore's ledger)."
    - "8:30 PM — Clara finds the hall empty and nobody at the door, contradicting Whitmore's statement."
    - "8:55 PM — Whitmore returns the spare key."
    - "9:35 PM — Lord Ashford finds the emerald gone from the locked study."
  explanation: >-
    Only two keys exist. Lord Ashford's stayed on his chain. The spare was in a cabinet only Whitmore could open, and
    Mr. Dunmore's ledger records him taking it at 8:20 and returning it at 8:55. Whitmore swore he never touched the
    cabinet and never left the hall, but Miss Bennett — a direct witness — found the hall empty at half past eight.
    Eleanor's remark about Richard is an assumption, not an observation, and Lord Ashford's own memorandum proves no
    one else handled the stone.
  insight: >-
    Distinguishing direct observation (Miss Bennett, Mr. Dunmore's ledger) from assumption (Miss Ashford's guess about
    Richard) exposed the caretaker's false claim of never leaving the hall.
  required_evidence: [access_ledger, whitmore_statement, clara_statement, dinner_timeline]
  related_evidence: [lord_note, study_report, message, eleanor_statement, richard_statement]
  concepts:
    - id: c1
      text: Whitmore took the spare study key from the key cabinet at 8:20 PM according to the butler's ledger.
      keywords: [key, cabinet, ledger, "8:20", spare]
    - id: c2
      text: Whitmore claimed he never left the hall or touched the cabinet, but the ledger and Clara's account contradict him.
      keywords: [hall, contradict, empty, claimed, statement]
    - id: c3
      text: Eleanor only assumed that Richard handled the emerald; it was not an observation, and Lord Ashford held it himself.
      keywords: [assumed, assumption, eleanor, richard, observation]
  what_options:
    - {id: a, text: "The caretaker used the spare key to enter the study while the household was at dinner and took the emerald.", correct: true}
    - {id: b, text: "Richard Hale took the emerald when he left the table for the smoking room.", correct: false}
    - {id: c, text: "Eleanor Ashford slipped away at half past eight and broke into the study.", correct: false}
    - {id: d, text: "Lord Ashford never locked the study and any guest could have walked in.", correct: false}
  when_options:
    - {id: a, text: "Around 7:15 PM, during the viewing", correct: false}
    - {id: b, text: "Between about 8:20 PM and 8:55 PM, during dinner", correct: true}
    - {id: c, text: "At about 9:30 PM, when Lord Ashford returned", correct: false}
    - {id: d, text: "After 10:00 PM, at the mews gate", correct: false}
  insight_options:
    - {id: a, text: "Miss Ashford's assumption about Richard was not an observation and proved nothing, while the ledger and Miss Bennett's observation contradicted the caretaker.", correct: true}
    - {id: b, text: "Richard's absence from the table at twenty to nine proves he took the key.", correct: false}
    - {id: c, text: "Miss Bennett's trip to the hall shows she was looking for the key.", correct: false}
    - {id: d, text: "Eleanor's debts alone prove she is guilty.", correct: false}
