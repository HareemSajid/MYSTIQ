hints:
  - >-
    Dr. Watson: "Four people swear they knew nothing of the letter. Ask yourself not who had a motive, but who knew
    something that they could only have learned from the letter itself."
  - >-
    Dr. Watson: "Set each suspect's words beside the wording of the letter, and beside what the newspapers did and did
    not print. The Inspector withheld the contents. Which details were never public?"
  - >-
    Dr. Watson: "One suspect names a place and an hour that appear only in the letter, yet Mr. Blackwood's own private
    note says he told no one of its contents. Compare Mr. Blake's statement with the letter."
solution:
  culprit: blake
  what: >-
    Arthur Blake wrote and delivered the threatening letter at 11:55 PM to lure Blackwood to Wapping Stairs, then
    betrayed his knowledge of its private details in his statement.
  when: The letter was delivered at 11:55 PM on Thursday 19 November; Blackwood left at 6:30 AM on Friday.
  sequence:
    - "Tuesday — Blackwood publicly mentions his grey ledger in a newspaper interview."
    - "Thursday afternoon — Blake calls three times asking where Blackwood will be on Friday morning."
    - "11:55 PM — A hand-delivered, unstamped letter is posted through the letter-box."
    - "12:20 AM — Blackwood writes to his solicitor that he has told no one of its contents."
    - "6:30 AM Friday — Blackwood leaves the house carrying the ledger."
    - "Saturday — Blake, claiming ignorance, mentions Wapping Stairs and first light."
  explanation: >-
    The grey ledger was public from the newspaper interview, but Wapping Stairs, first light and the instruction to go
    alone appear only in the letter, whose contents the police withheld. Blackwood told his solicitor he had told no one,
    and the letter arrived after Blake had left. Yet Blake's statement refers to Wapping Stairs at first light. The
    other three suspects only repeat what was public.
  insight: >-
    Blake revealed implicit knowledge: details found only in the withheld letter, though he claimed he never heard of it.
  required_evidence: [letter, police_notice, blake_statement, private_letter]
  related_evidence: [delivery_record, diary, interview, torn_note, margaret_statement, reed_statement, helen_statement]
  concepts:
    - id: c1
      text: Blake mentioned Wapping Stairs and first light, details found only in the withheld letter.
      keywords: [wapping, stairs, first light, letter, details]
    - id: c2
      text: The police withheld the contents of the letter and Blackwood told his solicitor he told no one, so Blake could not have learned them innocently.
      keywords: [withheld, told no one, solicitor, public, notice]
    - id: c3
      text: The grey ledger was already public from the interview, so Reed and others knowing it proves nothing.
      keywords: [ledger, interview, public, reed, newspaper]
  what_options:
    - {id: a, text: "Arthur Blake wrote and delivered the letter, then revealed knowledge of its private details.", correct: true}
    - {id: b, text: "Thomas Reed wrote the letter to create a news story.", correct: false}
    - {id: c, text: "Margaret Wells delivered the letter after leaving the office.", correct: false}
    - {id: d, text: "Helen Blackwood took the letter from the box and concealed it.", correct: false}
  when_options:
    - {id: a, text: "The letter was delivered at about 11:55 PM on Thursday night.", correct: true}
    - {id: b, text: "The letter was delivered on Tuesday after the interview.", correct: false}
    - {id: c, text: "The letter was delivered at 6:30 AM on Friday.", correct: false}
    - {id: d, text: "The letter was delivered on Saturday after the police notice.", correct: false}
  insight_options:
    - {id: a, text: "Blake knew Wapping Stairs and first light, details never published and told to no one, which could only come from the letter.", correct: true}
    - {id: b, text: "Reed knew about the grey ledger, which proves he sent the letter.", correct: false}
    - {id: c, text: "Margaret's diary shows she was at the house at midnight.", correct: false}
    - {id: d, text: "Helen heard the letter-box, which proves she wrote the letter.", correct: false}
