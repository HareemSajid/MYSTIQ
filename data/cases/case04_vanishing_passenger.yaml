  - key: seating_arrangement
    title: Compartment C Seating Arrangement
    doc_type: Plan
    datetime: Tuesday, 10 November 1891
    author: George Mills, guard
    suspect: mills
    content: |
      COMPARTMENT C — seating, as noted by the guard at Waterloo, 7:40 PM.

      Platform side at Vauxhall is the LEFT side in the direction of travel. The compartment has two doors, one each side.

      Seat 1 — left-hand door, forward corner: Mr. C. Bennett.
      Seat 2 — left side, beside Seat 1: Mr. A. Crane.
      Seat 3 — left side, next: Miss E. Foster.
      Seat 4 — right side, opposite Seat 1: Mr. P. Shaw (blue coat).
      Seats 5 to 8 — other passengers, who alighted at Waterloo's far platform and are not on record.
  - key: station_records
    title: Station Arrival Records and Train Schedule
    doc_type: Schedule
    datetime: Tuesday, 10 November 1891
    author: South Western Railway Traffic Office
    suspect: null
    content: |
      SCHEDULE — 7:40 PM Waterloo to Clapham Junction (express, one call):
      7:40 PM — Departs Waterloo.
      7:46 PM — Arrives Vauxhall. Platform on the left-hand side only.
      7:47 PM — Departs Vauxhall at the guard's whistle.
      7:58 PM — Arrives Clapham Junction.

      The train does not stop between Vauxhall and Clapham Junction. A running train cannot be left without alarm.
  - key: luggage
    title: Luggage and Passenger Descriptions
    doc_type: Report
    datetime: Tuesday, 10 November 1891
    author: Clapham Junction Lost Property Office
    suspect: null
    content: |
      LUGGAGE AND DESCRIPTIONS — taken at Clapham Junction, 8:10 PM.

      Rack, Compartment C: one black leather valise, initials A.C.; contents — clothes, a Bible, shaving gear. No overcoat.
      Description of Mr. A. Crane (from Miss Foster and the booking clerk): about sixty-five, grey whiskers, pale, wearing a
      grey ulster and carrying a silver-topped cane.
      Description of Mr. C. Bennett (from the booking clerk): stout, about fifty, in a chestnut-brown overcoat and bowler.
      Description of Mr. P. Shaw: young, thin, in a blue coat.
  - key: travel_note
    title: Mr. Crane's Handwritten Travel Note
    doc_type: Note
    datetime: Tuesday, 10 November 1891, 7:36 PM
    author: Alistair Crane (pocket diary)
    suspect: null
    content: |
      Found in the pocket diary left in the valise.

      "7:36 PM. Waterloo. The man in the corner by the left-hand door has been watching me since the booking office. He
      asked me to step down at V. with him for a quiet word about the old contract. I do not like it. E. is not to be told.
      If I am not at Clapham, ask at V."
  - key: bennett_statement
    title: Statement of Mr. Charles Bennett
    doc_type: Statement
    datetime: Wednesday, 11 November 1891
    author: Charles Bennett
    suspect: bennett
    content: |
      Statement of Charles Bennett to Inspector Lestrade.

      I never left my seat between Waterloo and Clapham Junction. I did not speak to the old gentleman. I sat in the
      corner of the compartment by the left-hand door. I know nothing of what became of him.
  - key: emily_statement
    title: Statement of Miss Emily Foster
    doc_type: Statement
    datetime: Wednesday, 11 November 1891
    author: Emily Foster
    suspect: emily
    content: |
      Statement of Emily Foster.

      I was dozing against the window and did not see Mr. Crane leave. I woke at Clapham Junction and his seat was empty.
      I assumed he had stepped down at Vauxhall for air, alone, because he found the carriage warm. Beside us, by the
      left-hand door, sat a stout gentleman in a brown overcoat who kept looking at my master.
  - key: mills_statement
    title: Statement of Mr. George Mills, Guard
    doc_type: Statement
    datetime: Wednesday, 11 November 1891
    author: George Mills
    suspect: mills
    content: |
      Statement of George Mills, guard, to Inspector Lestrade.

      At Vauxhall I was at the rear of the train. At about 7:46 PM I saw an elderly gentleman in a grey ulster step down on
      to the platform, supported by a gentleman in a brown overcoat. I blew the whistle at 7:47 PM. I did not see the
      gentleman in the brown overcoat get back on the train. I could not say who he was.
  - key: shaw_statement
    title: Statement of Mr. Peter Shaw
    doc_type: Statement
    datetime: Wednesday, 11 November 1891
    author: Peter Shaw
    suspect: shaw
    content: |
      Statement of Peter Shaw.

      I sat opposite the left-hand door in a blue coat, reading my newspaper. At Vauxhall the stout gentleman by the
      left-hand door stood up, took the old gentleman's arm, and stepped down with him. At the whistle the stout
      gentleman came back alone and sat down. He did not speak to anyone. I thought it was kindness.
