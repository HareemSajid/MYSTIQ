hints:
  - >-
    Dr. Watson: "Different witnesses use different words — 'the stout gentleman', 'the man in brown', 'the man by the
    left-hand door'. Ask whether they are all describing the same person."
  - >-
    Dr. Watson: "Use the guard's seating arrangement to learn who sat by the left-hand door, and remember which side of
    the train the platform lay on at Vauxhall."
  - >-
    Dr. Watson: "Mr. Mills did not see the man in brown re-board, but he was at the rear; that is no contradiction.
    Compare Mr. Bennett's claim never to have left his seat with Mr. Shaw's account and the barrier record."
solution:
  culprit: bennett
  what: >-
    Charles Bennett, seated by the left-hand door, persuaded Mr. Crane to step down at Vauxhall, walked him off the
    platform, and re-boarded alone at the whistle, then denied ever leaving his seat.
  when: At Vauxhall, between 7:46 PM and 7:47 PM.
  sequence:
    - "7:31 PM — Bennett buys a ticket after Crane."
    - "7:36 PM — Crane notes that the man by the left-hand door asked him to step down at Vauxhall."
    - "7:40 PM — Train leaves Waterloo."
    - "7:46 PM — At Vauxhall (platform on the left), the stout man in brown helps the old gentleman off."
    - "7:47 PM — The stout man re-boards alone at the guard's whistle."
    - "7:58 PM — At Clapham, Bennett's ticket is collected; Crane's is not."
  explanation: >-
    The seating arrangement places Bennett in Seat 1 by the left-hand door. Crane's note names 'the man in the corner by
    the left-hand door'. Emily and the guard describe a stout man in a brown overcoat, which the booking clerk's description
    gives to Bennett. Shaw saw him help Crane off and come back alone. Mills' failure to see him re-board was only because
    he was at the rear. The platform at Vauxhall was on the left, the door beside Bennett. Emily's belief that Crane stepped
    down alone was an assumption; she was asleep.
  insight: >-
    'The man by the left-hand door', 'the stout gentleman' and 'the gentleman in the brown overcoat' are all one person,
    Bennett, so his claim never to have left his seat is false.
  required_evidence: [seating_arrangement, travel_note, shaw_statement, mills_statement, luggage]
  related_evidence: [tickets, station_records, bennett_statement, emily_statement]
  concepts:
    - id: c1
      text: The left-hand door seat was Bennett's according to the seating arrangement, matching Crane's travel note.
      keywords: [seat, left-hand door, seating, bennett, note]
    - id: c2
      text: The stout gentleman, the man in the brown overcoat and the man by the left-hand door are the same person, Bennett.
      keywords: [stout, brown overcoat, same person, description, left-hand door]
    - id: c3
      text: Shaw saw him help Crane off and return alone at the whistle, contradicting Bennett's claim that he never left his seat; Mills simply did not see him re-board.
      keywords: [shaw, return, alone, whistle, never left]
  what_options:
    - {id: a, text: "Bennett walked Crane off the train at Vauxhall and re-boarded alone before the train left.", correct: true}
    - {id: b, text: "Crane fell from the moving train between Vauxhall and Clapham Junction.", correct: false}
    - {id: c, text: "Mills the guard escorted Crane off the train and kept his ticket.", correct: false}
    - {id: d, text: "Emily Foster pushed Crane from the compartment while the train was moving.", correct: false}
  when_options:
    - {id: a, text: "At Vauxhall, about 7:46 to 7:47 PM.", correct: true}
    - {id: b, text: "At Waterloo, about 7:36 PM.", correct: false}
    - {id: c, text: "At Clapham Junction, about 7:58 PM.", correct: false}
    - {id: d, text: "Between Vauxhall and Clapham while the train was running.", correct: false}
  insight_options:
    - {id: a, text: "The different descriptions all refer to Bennett, and his claim never to have left his seat is contradicted by Shaw and tied to Crane's note and the seating plan.", correct: true}
    - {id: b, text: "Mills did not see the man re-board, which proves he never returned.", correct: false}
    - {id: c, text: "Emily's belief that Crane went alone proves nobody was with him.", correct: false}
    - {id: d, text: "Shaw's blue coat proves he was the man in brown.", correct: false}
