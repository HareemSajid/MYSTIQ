number: 4
slug: vanishing-passenger
title: The Vanishing Passenger
difficulty: Medium-Hard
setting: The 7:40 PM from Waterloo to Clapham Junction — Tuesday, 10 November 1891
summary: >-
  A passenger disappears from a crowded compartment, leaving only his luggage behind.
introduction: >-
  On Tuesday evening, 10 November 1891, the 7:40 PM train left Waterloo for Clapham Junction, calling briefly at
  Vauxhall. When it reached Clapham Junction at 7:58 PM, Mr. Alistair Crane, a retired shipping clerk, was gone from
  Compartment C. His black valise still sat on the rack. The compartment was crowded and every passenger says they saw
  nothing unusual. But they describe the same few people in very different words.
objective: >-
  Work out who was where, and when, by recognising when different descriptions refer to the same person.
places: [Compartment C, Waterloo, Vauxhall, Clapham Junction, platform, left-hand door, rack, guard's van, barrier]
objects: [valise, ticket, overcoat, ulster, cane, note, notebook]
others:
  - {name: Alistair Crane, gender: m, role: the missing passenger, aliases: [Mr. Crane, Crane, the missing passenger, the old gentleman, the elderly gentleman, my uncle]}
  - {name: Inspector Lestrade, gender: m, role: the inspector, aliases: [Lestrade, the inspector]}
suspects:
  - key: bennett
    name: Charles Bennett
    role: a fellow passenger
    gender: m
    age: 53
    aliases: [Bennett, Mr. Bennett, Charles, the stout gentleman, the gentleman in the brown overcoat, the man by the left-hand door]
    background: >-
      A stout wool broker from Southwark who wears a heavy chestnut-brown overcoat. Brisk, impatient, with a past
      dispute over a shipping contract that Mr. Crane exposed.
    motive: >-
      Mr. Crane's evidence in a shipping inquiry cost Bennett his licence two years ago.
    relationship: Stranger to the other passengers on the train; known to Crane by name.
    whereabouts: Insists he never left his seat on the journey.
    personality: Gruff, impatient, answers briefly and flatly, resents repetition.
    private_knowledge: >-
      SECRET (never admit): he sat in the seat by the left-hand door, persuaded Crane to step down at Vauxhall for a quiet
      word about the shipping contract, walked him off the platform, and re-boarded at the guard's whistle alone.
      He will deny everything and insist he never left his seat.
    does_not_know: What the guard saw.
    deflect: "I have said I never left my seat, and I shall say it again."
    topics:
      - q: "Did you leave your seat? Did you get off the train at Vauxhall? Where were you at 7:46?"
        a: >-
          I never left my seat between Waterloo and Clapham. I did not stand and I did not step on to any platform.
      - q: "Did you speak to Mr. Crane? Did you know the old gentleman? Do you have a history with Crane?"
        a: >-
          I did not speak to him. I knew his name from an old business matter and that is all.
      - q: "Where did you sit? Which seat were you in? Were you by the door?"
        a: >-
          I sat in the corner by the left-hand door, as I always do. It is the draught, but I cannot abide the middle
          of a bench.
      - q: "Were you wearing a brown overcoat? Who wore a brown coat? What did you wear?"
        a: >-
          I own a brown overcoat, like half of London. It is cold in November, Inspector.
      - q: "Why does Mr. Shaw say the man by the left-hand door helped the old gentleman off? Why does Mills say a man in brown helped him? Why do your statements contradict?"
        a: >-
          They are mistaken, or looking at some other man. Half a carriage wears brown. I did not leave my seat.
      - q: "Where did Mr. Crane go? Who do you think took him? What do you know?"
        a: >-
          I have no idea what became of him. He may have stepped down for air. Ask the lady who was travelling with
          him.
  - key: emily
    name: Emily Foster
    role: Mr. Crane's travelling companion
    gender: f
    age: 29
    aliases: [Emily, Miss Foster, the companion, the lady, the young lady]
    background: >-
      Mr. Crane's paid companion and nurse for the past year. Sleepy by habit, honest, and devoted to the old man.
    motive: >-
      She would receive a small bequest if Crane died, but has no sign of wanting harm to come to him.
    relationship: Companion and nurse to Alistair Crane.
    whereabouts: Dozing against the window; woke at Clapham Junction.
    personality: Gentle, flustered, tends to assume the best and fill gaps with guesses.
    private_knowledge: >-
      She dozed from just after Waterloo. She woke at Clapham to find Mr. Crane gone. She assumed he had stepped down at
      Vauxhall for air, since he disliked the heat. She did not see him leave and does not know who he left with.
    does_not_know: Who accompanied Mr. Crane. What he wrote in his pocket diary.
    deflect: "Oh, I am so sorry, I truly do not know. I was asleep."
    topics:
      - q: "Where were you when Mr. Crane left? Did you see him leave? Were you awake at Vauxhall?"
        a: >-
          I was dozing against the window. I did not see him leave. I woke when the train reached Clapham and his seat
          was empty.
      - q: "Did Mr. Crane step down alone at Vauxhall? Did anyone go with him? Who was with him?"
        a: >-
          I assumed he stepped down for air alone, since he found the carriage warm. But I did not see him go, and I
          cannot say whether anyone accompanied him.
      - q: "Who sat where? Who was by the left door? Who was next to you?"
        a: >-
          I sat beside Mr. Crane. By the left-hand door sat a stout gentleman in a brown overcoat, and across from us a
          younger gentleman in a blue coat.
      - q: "Did Mr. Crane mention anyone? Was he afraid? Did he know Mr. Bennett?"
        a: >-
          He said little. He seemed uneasy after Waterloo, and kept glancing at the stout gentleman by the door, but I
          did not think much of it.
      - q: "Why did you not report him missing? What did you do at Clapham? What about the valise?"
        a: >-
          I told the guard at once. The valise is his; he left it on the rack. He would never leave it willingly.
  - key: mills
    name: George Mills
    role: a railway employee (guard)
    gender: m
    age: 45
    aliases: [Mills, Mr. Mills, George, the guard, the railway employee]
    background: >-
      A guard of eighteen years on the South Western line. Reliable, observant, by-the-book and keen not to be blamed.
    motive: >-
      None known; he fears for his position after a passenger was lost on his train.
    relationship: Employee of the railway; unconnected with the passengers.
    whereabouts: At the rear of the train at Vauxhall, in the guard's van.
    personality: Methodical, formal, deferential, careful to say only what he saw himself.
    private_knowledge: >-
      At Vauxhall at 7:46 he saw an elderly gentleman in a grey ulster step on to the platform, supported by a gentleman in
      a brown overcoat. He was at the rear and blew the whistle at 7:47 and did not see who re-boarded.
    does_not_know: Who re-boarded; the names of those involved.
    deflect: "I report only what I have seen, sir, and I did not see more."
    topics:
      - q: "What did you see at Vauxhall? Who got off at Vauxhall? Did you see an old gentleman?"
        a: >-
          At Vauxhall I saw an elderly gentleman in a grey ulster step down, supported by a gentleman in a brown
          overcoat. They walked towards the barrier.
      - q: "Did you see the man in the brown overcoat get back on? Who re-boarded? Why did you not see?"
        a: >-
          I did not see him re-board, sir. I was at the rear of the train and blew the whistle at 7:47. That is not to say
          he did not.
      - q: "Where were you at 7:46? Where were you at Vauxhall?"
        a: >-
          At the rear in the guard's van, sir, until the whistle.
      - q: "Who was the man in the brown overcoat? Do you know his name? Can you identify him?"
        a: >-
          I could not say who he was. I saw the coat and a stout build. You would need the seating arrangement to tell
          you who sat where.
      - q: "Did you check the tickets? What happened at Clapham? How many tickets were collected?"
        a: >-
          At Clapham the barrier collected three tickets from Compartment C, and no ticket from the missing gentleman. His
          valise was left on the rack.
  - key: shaw
    name: Peter Shaw
    role: a passenger sitting nearby
    gender: m
    age: 26
    aliases: [Shaw, Mr. Shaw, Peter, the young man, the younger gentleman, the passenger in the blue coat]
    background: >-
      A junior clerk in a blue coat, a regular on this train who reads the same newspaper every evening. Observant, shy,
      and careful about what he saw.
    motive: >-
      None known.
    relationship: Fellow passenger; unconnected to the others.
    whereabouts: Sat opposite the left-hand door, reading a newspaper.
    personality: Mild, hesitant, qualifies statements with 'I think' when unsure but is precise about what he observed.
    private_knowledge: >-
      He saw the stout man by the left-hand door stand up at Vauxhall, put on a brown overcoat, take the old gentleman's
      arm, and step down with him. Within a minute the stout man returned alone and sat down, saying nothing.
    does_not_know: What was said on the platform.
    deflect: "I think I have told you all I saw, sir."
    topics:
      - q: "What did you see at Vauxhall? Did anyone get off? Who got off the train?"
        a: >-
          At Vauxhall the stout gentleman by the left-hand door stood up, took the old gentleman's arm, and stepped down with
          him. I saw them go together.
      - q: "Did the stout man come back? Who re-boarded? Did anyone return?"
        a: >-
          Yes. At the whistle the stout man came back alone and sat down in the corner by the left-hand door. He did not
          say a word.
      - q: "Who sat where? Where was Mr. Bennett? Who was by the door?"
        a: >-
          I sat opposite the left-hand door in a blue coat. The corner by that door was taken by the stout gentleman; I
          believe his name is Mr. Bennett, going by the seating arrangement.
      - q: "Do you know the passengers? What was Mr. Crane like? Did he seem unwell?"
        a: >-
          I did not know any of them. The old gentleman looked pale, I thought, but he went with the stout man willingly.
      - q: "Why were you reading? Did you not notice earlier? Why did you say nothing?"
        a: >-
          I thought it was kindness, sir, a gentleman helping an old man off for air. It did not occur to me to say anything.
