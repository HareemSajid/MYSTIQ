hints:
  - >-
    Dr. Watson: "No single clue will do it, my friend. Look for words and objects that are present where they should not
    be: whose phrase appears in the letter, and whose key was never truly returned?"
  - >-
    Dr. Watson: "Set the key register beside the household schedule. At 4:30 PM, who was there to receive the key? And do
    not overlook the document that seems irrelevant — the coal merchant's receipt."
  - >-
    Dr. Watson: "A lady in a black veil signed for the coal at the garden door. Whom does Mr. Ford say wears a veil? And
    whose diary says whose phrase is 'a cabinet of curiosities'? Three independent lines, Holmes would say, to one end."
solution:
  culprit: reed
  what: >-
    Margaret Reed kept the spare key after writing that she had returned it, slipped in by the garden door during the coal
    delivery, lured Mr. Hargreave out with a forged note, left a letter in her own phrasing on the desk, and locked the Curio
    Room from outside, taking the key.
  when: Between about 9:30 PM and 9:55 PM on Friday 27 November, while the garden door stood open.
  sequence:
    - "4:00 PM — Reed is issued Key B; Ford leaves at 4:15 PM with the cabinet locked."
    - "4:30 PM — Reed writes 'Returned. M.R.' in the register, although nobody could receive the key."
    - "5:10 PM — Reed leaves by the front door."
    - "9:20 PM — A forged note signed 'L.' summons Hargreave to the garden gate at ten."
    - "9:30 PM–9:55 PM — The garden door is open for the coal; a lady in a black veil signs for the delivery."
    - "About 9:45 PM — Hargreave leaves the Curio Room; the letter is placed on the desk; the room is locked from outside."
    - "11:15 PM — The door is forced; the room is empty."
  explanation: >-
    Three independent lines point to Mrs. Reed. (1) The letter's phrase 'cabinet of curiosities' is Mrs. Reed's own phrase
    per Hargreave's diary, which he dislikes. (2) The key register shows she wrote 'Returned' at 4:30 PM, but the schedule
    shows the cabinet was locked and Ford away from 4:15 PM, so Key B was never returned; she kept it and the room was locked
    from outside. (3) The coal merchant's apparently irrelevant receipt records a veiled lady at the garden door between 9:30
    and 9:55 PM, and Ford says Mrs. Reed alone wears a veil, while White denies she does. Black, White, Ford and Lane are
    cleared by their alibis and the forged 'L.' note, which Lane denies and his telegram contradicts.
  insight: >-
    The 'irrelevant' coal receipt, the false 'returned' key entry and the letter's borrowed phrase together expose Mrs. Reed;
    each alone is insufficient.
  required_evidence: [letter, diary, key_register, schedule, coal_receipt]
  related_evidence: [ford_statement, white_statement, messages, visitor_record, room_inspection, reed_statement, timeline]
  concepts:
    - id: c1
      text: The letter uses the phrase cabinet of curiosities, which the diary shows is Mrs. Reed's phrase and not Hargreave's.
      keywords: [cabinet of curiosities, phrase, diary, letter, wording]
    - id: c2
      text: Reed wrote that she returned Key B at 4:30 but the schedule shows the cabinet was locked and Ford away, so she kept the key.
      keywords: [key, returned, "4:30", cabinet, locked]
    - id: c3
      text: A veiled lady signed the coal receipt at the garden door; Ford says only Mrs. Reed wears a veil.
      keywords: [veil, coal, receipt, garden door, ford]
  what_options:
    - {id: a, text: "Reed kept the spare key, entered by the garden door, lured Hargreave out with a forged note and locked the room from outside.", correct: true}
    - {id: b, text: "Black wrote the letter and removed Hargreave to force the sale.", correct: false}
    - {id: c, text: "Ford locked the room with the spare key and hid his master in the cellar.", correct: false}
    - {id: d, text: "Lane sent the garden-gate note and spirited Hargreave away.", correct: false}
  when_options:
    - {id: a, text: "Between about 9:30 PM and 9:55 PM, while the garden door was open for the coal.", correct: true}
    - {id: b, text: "At 4:30 PM when the key was supposedly returned.", correct: false}
    - {id: c, text: "At 11:15 PM when the door was forced.", correct: false}
    - {id: d, text: "At 7:30 PM when Mr. Black left.", correct: false}
  insight_options:
    - {id: a, text: "The letter's phrase, the false key return, and the veiled lady on the coal receipt, each independent, all point to Mrs. Reed.", correct: true}
    - {id: b, text: "The letter names Black, which proves he wrote it.", correct: false}
    - {id: c, text: "White's spectacles prove she wore the veil.", correct: false}
    - {id: d, text: "Lane's telegram proves he met Hargreave at the gate.", correct: false}
