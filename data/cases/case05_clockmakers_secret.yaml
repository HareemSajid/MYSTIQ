hints:
  - >-
    Dr. Watson: "Mind the exact words, my friend. Several of our witnesses say nothing false, and yet leave an impression
    that is. Ask what each statement carefully avoids saying."
  - >-
    Dr. Watson: "Mr. Pemberton's diary records a key cut for someone. Compare the precise wording of the keyholder's
    statement. Whose key did she say she never touched?"
  - >-
    Dr. Watson: "Mr. Pemberton told Captain Finch he was engaged over a matter refused 'an hour ago', at twenty past eight.
    Whom did he refuse at about seven — and whom at half past five? Then note when the regulator stopped."
solution:
  culprit: mary
  what: >-
    Mary Collins returned with the second key after closing, was refused the lift angle again, struck Mr. Pemberton in the
    struggle at 8:47 PM, and took the working sheet, while her statement misleads by being literally true.
  when: At about 8:47 PM on Tuesday 2 June, when the regulator clock stopped.
  sequence:
    - "12 Feb — Pemberton has a second key cut for Mary."
    - "5:30 PM — Stone is refused at the counter."
    - "7:05 PM — Mary asks again for the lift angle and is refused; she leaves."
    - "About 8:10 PM — Mary returns with the second key."
    - "8:20 PM — Pemberton tells Finch he is engaged over the matter refused 'an hour ago'; a woman's voice is heard."
    - "8:47 PM — The regulator is knocked down and stops; Pemberton is struck."
    - "9:30 PM — The constable finds Pemberton; the working sheet is gone."
  explanation: >-
    Mary said she never touched Pemberton's key again, which is literally true but conceals the second key cut for her in
    February. Pemberton said at 8:20 that he was engaged over a matter refused 'an hour ago', which matches his refusal of
    Mary at 7:05 PM, not Stone at 5:30 PM. Finch heard a woman's voice. His own marginal note names 'M.' as asking about
    the lift angle. The regulator stopped at 8:47. Stone's and Finch's literal statements mislead about presence, but their
    other evidence clears them; Oliver was at home.
  insight: >-
    Mary's statement was technically true (she never touched his key) but misleading, hiding the second key; the 'hour ago'
    remark identifies her as the one he refused at seven.
  required_evidence: [mary_statement, diary, finch_statement, clock_report, design_note]
  related_evidence: [customer_register, repair_log, technical_letter, stone_statement, oliver_statement]
  concepts:
    - id: c1
      text: Mary's statement that she never touched his key is technically true but conceals the second key cut for her.
      keywords: [second key, literally, misleading, diary, key]
    - id: c2
      text: Pemberton told Finch he was engaged over a matter refused an hour ago, which matches Mary at 7:05 PM, not Stone at 5:30 PM.
      keywords: [hour ago, refused, seven, finch, "5:30"]
    - id: c3
      text: A woman's voice was heard at 8:20, M. is named in the design note, and the regulator stopped at 8:47.
      keywords: [woman, voice, regulator, "8:47", note]
  what_options:
    - {id: a, text: "Mary Collins returned with her second key, was refused again, struck Mr. Pemberton and took the sheet.", correct: true}
    - {id: b, text: "Frederick Stone forced the back door and took the design at half past five.", correct: false}
    - {id: c, text: "Oliver Grant crept back from Bethnal Green after eight and took the design.", correct: false}
    - {id: d, text: "Captain Finch entered the workshop at twenty past eight to retrieve his chronometer.", correct: false}
  when_options:
    - {id: a, text: "At about 8:47 PM, when the regulator clock stopped.", correct: true}
    - {id: b, text: "At 5:30 PM, when Stone called.", correct: false}
    - {id: c, text: "At 7:05 PM, when Mary left.", correct: false}
    - {id: d, text: "At 9:30 PM, when the constable arrived.", correct: false}
  insight_options:
    - {id: a, text: "Mary's literally true statement hid the second key, and 'refused an hour ago' ties the visitor to the 7:05 PM refusal of Mary.", correct: true}
    - {id: b, text: "Stone's offer letter proves he entered the workshop.", correct: false}
    - {id: c, text: "Oliver's early departure proves he lied about being home.", correct: false}
    - {id: d, text: "Finch's statement that he did not set foot in the workshop proves he lied.", correct: false}
