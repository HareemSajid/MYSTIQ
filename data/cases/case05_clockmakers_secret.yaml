number: 5
slug: clockmakers-secret
title: The Clockmaker's Secret
difficulty: Hard
setting: Pemberton & Son, Clerkenwell — Tuesday, 2 June 1891
summary: >-
  A respected clockmaker is found unconscious and his most valuable design has gone.
introduction: >-
  At half past nine on Tuesday, 2 June 1891, Constable Dyer found Josiah Pemberton, master clockmaker of Clerkenwell,
  unconscious on his workshop floor. His regulator clock lay smashed beside him, and the working sheet of his new detent
  escapement — the work of five years — was gone. Four people had business with the shop that day. Every one of them
  tells the truth, in a manner of speaking.
objective: >-
  Separate what each person literally says from what they want you to believe, and combine the documents to find who
  was in the workshop.
places: [workshop, shop, shop door, back door, Clerkenwell, Islington, Bethnal Green]
objects: [escapement, design, regulator clock, key, second key, chronometer, carriage clock, note, diary]
others:
  - {name: Josiah Pemberton, gender: m, role: the clockmaker, aliases: [Mr. Pemberton, Pemberton, the clockmaker, the master, J.P.]}
  - {name: Constable Dyer, gender: m, role: the constable, aliases: [Dyer, the constable]}
  - {name: Inspector Gregson, gender: m, role: the inspector, aliases: [Gregson, the inspector]}
suspects:
  - key: oliver
    name: Oliver Grant
    role: Pemberton's apprentice
    gender: m
    age: 19
    aliases: [Oliver, Grant, Mr. Grant, the apprentice]
    background: >-
      An eager apprentice in his third year who idolises his master. Quick-tempered and proud of his craft.
    motive: >-
      Pemberton refused to let him work on the new escapement, calling him too young.
    relationship: Apprentice of Josiah Pemberton.
    whereabouts: Left at half past six; at his lodgings in Bethnal Green from eight.
    personality: Earnest, indignant at suspicion, answers literally.
    private_knowledge: >-
      He left at half past six and went straight home, where his landlady saw him in by eight. He did not go out again.
      He knows nothing of the key arrangement.
    does_not_know: That Mary had a second key.
    deflect: "I love this shop, sir. I would no more harm him than my own father."
    topics:
      - q: "Where were you at eight? Where were you that evening? When did you leave?"
        a: >-
          I left at half past six, as the diary says, and went straight home to Bethnal Green. My landlady saw me in by
          eight and I did not go out again.
      - q: "Who has keys to the workshop? Who had a key? Did anyone have a second key?"
        a: >-
          Mr. Pemberton had the key. Mary closed up each evening and handed it to him. I never had one, and I know of no
          second.
      - q: "Why were you refused the escapement? Did you want the design? Do you have a motive?"
        a: >-
          He said I was too young. I was cross, but I would not steal what I hope one day to be taught.
      - q: "Who do you suspect? What about Mary, Mr. Stone or Mr. Finch?"
        a: >-
          Mr. Stone wanted the design badly, everyone knew it. And Mr. Finch came knocking late. I will not say more.
  - key: stone
    name: Frederick Stone
    role: a rival clockmaker
    gender: m
    age: 55
    aliases: [Stone, Mr. Stone, Frederick, the rival]
    background: >-
      Pemberton's long-time rival, jealous of his reputation. Polished, silky, and a master of phrasing.
    motive: >-
      Offered five hundred pounds for the escapement, and was refused. His own business is failing.
    relationship: Rival of Josiah Pemberton.
    whereabouts: Called at the shop at half past five; then at the Horological Society dinner from seven until after ten.
    personality: Smooth, careful, deliberately literal, avoids direct lies.
    private_knowledge: >-
      He called at the shop front at half past five and was refused. He then went to the Horological Society dinner in
      Clerkenwell Road, which lasted from seven until after ten. He wrote the technical letter offering five hundred pounds.
      He has not been inside the workshop proper for a year, which is literally true, but he did visit the shop front.
    does_not_know: Who entered the workshop that night.
    deflect: "I have been perfectly candid, Inspector. I deal in facts, not in fancies."
    topics:
      - q: "Have you been in the workshop? When were you last at Pemberton's? Did you visit the shop?"
        a: >-
          I have not been inside Pemberton's workshop in over a year. I did call at the front of the shop on Tuesday at half
          past five, on business, and was refused.
      - q: "Where were you at eight? Where were you that evening? What about the dinner?"
        a: >-
          I was at the Horological Society dinner in Clerkenwell Road, which began at seven and ended after ten. Fifty
          gentlemen can say so.
      - q: "Why did you write the letter offering money? Did you want the escapement? Do you have a motive?"
        a: >-
          I made a business offer, as any prudent tradesman would. It was refused. I bear no grudge.
      - q: "Have you spoken to Mr. Pemberton? When did you last speak to him?"
        a: >-
          I spoke to him at the counter at half past five on Tuesday, and wrote to him on Friday. I have not spoken to him
          since.
      - q: "Who do you suspect? What about Mary, Oliver or Arthur?"
        a: >-
          Pemberton's assistant knew his habits better than any man. I say no more.
  - key: mary
    name: Mary Collins
    role: Pemberton's assistant
    gender: f
    age: 34
    aliases: [Mary, Miss Collins, the assistant]
    background: >-
      Pemberton's assistant for nine years and a gifted clock-finisher, who has never been allowed to learn the new design.
      Quiet, controlled, with a widowed mother to support and rent arrears.
    motive: >-
      Repeatedly refused the secret of the new escapement, which Mr. Stone would pay heavily for; her mother's rent is
      overdue.
    relationship: Assistant to Josiah Pemberton.
    whereabouts: Claims to have left at seven and to have been home in Islington before ten.
    personality: Composed, exact, chooses words with great care, never volunteers anything.
    private_knowledge: >-
      SECRET (never admit): she left at seven, returned at about ten past eight with the second key Mr. Pemberton had cut for
      her in February, was refused again, struck him in the struggle at 8:47, and took the working sheet. Every sentence she
      speaks is carefully true or evasive. She never lies outright and never confesses.
    does_not_know: That Mr. Finch spoke to Mr. Pemberton at the door at twenty past eight.
    deflect: "I have said what I have to say, Inspector, and every word of it is true."
    topics:
      - q: "Do you have a key to the workshop? Who has keys to the workshop? Do you hold a key?"
        a: >-
          I locked the shop at seven and handed Mr. Pemberton his key, as I always do. After that I never touched his key
          again.
      - q: "Did you have a second key? Why does the diary say a second key was cut for you? Why did you not mention the other key?"
        a: >-
          Mr. Pemberton once had a key cut so that I could open in the cold of a morning. I did not say I had no key. I said
          I never touched his.
      - q: "Where were you at eight? Where were you that evening? When did you leave?"
        a: >-
          I left at seven, and was home in Islington before ten. I do not keep a clock in my head for every minute between.
      - q: "Did you see Mr. Pemberton after seven? Did you speak to him that evening? Did you ask about the escapement?"
        a: >-
          The last I knew of the matter was when Constable Dyer called at my lodgings at ten. I asked about the escapement
          often, as any assistant might. He always said no.
      - q: "Why did Mr. Pemberton refuse you at seven? Who was refused an hour ago? Who did he refuse?"
        a: >-
          I cannot say what Mr. Pemberton thought on any subject. He refused many people many things.
      - q: "Do you need money? Do you have a motive? Why would you want the design?"
        a: >-
          My mother's rent is overdue, I do not hide it. But the design is of no use to me; I cannot sell what I cannot
          complete.
  - key: finch
    name: Arthur Finch
    role: a regular customer
    gender: m
    age: 61
    aliases: [Finch, Mr. Finch, Arthur, the customer]
    background: >-
      A retired naval officer who owns several costly chronometers. Courteous, exact, slightly deaf and fond of precise
      wording.
    motive: >-
      None known beyond a long-standing admiration for Pemberton's work.
    relationship: Regular customer of Pemberton & Son.
    whereabouts: Collected his chronometer at ten past six; returned briefly at twenty past eight.
    personality: Courteous, precise, careful about what he actually heard versus guessed.
    private_knowledge: >-
      He collected his chronometer at ten past six and left. At twenty past eight he returned because the chronometer was
      losing, found the shop shut, knocked, and spoke through the shop door with Mr. Pemberton, who said he could not attend
      him: he was engaged with someone over the very matter he had refused an hour ago. Finch heard a woman's voice behind him.
    does_not_know: Who the visitor was.
    deflect: "I report only what I heard, Inspector. I am an old man and I cannot swear to more."
    topics:
      - q: "When did you collect your chronometer? When were you at the shop? Did you go back?"
        a: >-
          I collected it at ten past six and left. I never set foot in the workshop that day. I did go back to the shop front
          at twenty past eight, but the door was shut.
      - q: "What did Mr. Pemberton say at twenty past eight? What did you hear? Who was with him?"
        a: >-
          Through the shop door he told me he could not attend to me; he was engaged with someone over the very matter he had
          refused an hour ago. I heard a woman's voice behind him, but I could not say whose.
      - q: "Why did you not mention that earlier? Why did you say you did not set foot in the workshop?"
        a: >-
          I did not set foot in the workshop, and said so. I stood at the shop door. You did not ask me what I heard.
      - q: "Who do you suspect? What about Mary, Oliver or Mr. Stone?"
        a: >-
          I would not guess. I heard a woman's voice, that is all.
documents:
  - key: diary
    title: Workshop Diary
    doc_type: Diary
    datetime: 12 February – 2 June 1891
    author: Josiah Pemberton
    suspect: null
    content: |
      WORKSHOP DIARY of Josiah Pemberton.

      12 Feb. — Had a second key cut for Mary, who grumbles at waiting on the step in the cold of a morning. Told her to
      guard it well.
      28 May. — Mary asked again after the lift angle of my new detent escapement. Told her the figure lives in my head and
      nowhere else.
      2 June, 5:30 PM. — Stone called at the counter, offering money. Refused him.
      2 June, 6:30 PM. — Oliver gone home.
      2 June, 7:05 PM. — Mary asked once more, as she was leaving, whether I would let her see the angle. Refused her again;
      she went without a word. Locked the shop after her. I shall work on the Harcourt carriage clock until ten.
  - key: repair_log
    title: Repair Log
    doc_type: Record
    datetime: Tuesday, 2 June 1891
    author: Josiah Pemberton and Mary Collins
    suspect: null
    content: |
      REPAIR LOG — Pemberton & Son.

      Tue 2 June
      9:00 AM — Mrs. Harcourt's carriage clock received for cleaning (J.P.).
      2:00 PM — Captain Finch's marine chronometer regulated; to be collected after six (M.C.).
      6:10 PM — Chronometer collected by Captain Finch (J.P.).
      7:00 PM — Shop closed (M.C.).
  - key: customer_register
    title: Customer Register
    doc_type: Register
    datetime: Tuesday, 2 June 1891
    author: Mary Collins and Josiah Pemberton
    suspect: null
    content: |
      CUSTOMER REGISTER — kept at the counter.

      Tue 2 June
      5:30 PM — Mr. F. Stone, called on business; refused; left by the shop door.
      6:10 PM — Captain A. Finch, collected chronometer; left.
      8:20 PM — Captain A. Finch, called again; chronometer losing; shop shut; spoke to Mr. P. through the shop door; not admitted.
  - key: technical_letter
    title: Technical Letter from Mr. Stone
    doc_type: Letter
    datetime: Friday, 29 May 1891
    author: Frederick Stone
    suspect: stone
    content: |
      Frederick Stone, Clockmaker, to Josiah Pemberton.

      Dear Pemberton, I have heard of your detent escapement and the remarkable accuracy it promises. I will give you five
      hundred pounds for the design, complete. I understand that the critical figure, the lift angle, has been entrusted
      to no one. Would you reconsider? I remain at your service, F. Stone.
  - key: clock_report
    title: Workshop Clock Inspection Report
    doc_type: Report
    datetime: Wednesday, 3 June 1891
    author: Inspector Gregson
    suspect: null
    content: |
      Inspection of the workshop by Inspector Gregson.

      The workshop regulator clock was found on the floor beside Mr. Pemberton, its glass broken and the movement stopped
      at 8:47 PM. A regulator that falls from its wall stops at the moment it is struck. The back door and the shop door
      were locked from outside; neither was forced. The shop door lock is intact. The workshop has two keys: the master's
      and the one cut in February.
  - key: design_note
    title: Partially Completed Design Note
    doc_type: Note
    datetime: Tuesday, 2 June 1891
    author: Josiah Pemberton
    suspect: null
    content: |
      Torn lower half of a sheet found beneath Mr. Pemberton's hand.

      "Detent escapement, version 4. Pallet lift: ____ degrees (to be entered when trials are done). Note: M. asked after
      the lift angle again tonight. Told her nothing; written nowhere. I do not like how she looks at the drawers. Do not
      trust —"
      (The remainder is torn away.)
  - key: oliver_statement
    title: Statement of Mr. Oliver Grant
    doc_type: Statement
    datetime: Wednesday, 3 June 1891
    author: Oliver Grant
    suspect: oliver
    content: |
      Statement of Oliver Grant.

      I left at half past six, as the diary will confirm, and went straight home to my lodgings in Bethnal Green. My
      landlady will tell you I was in by eight and did not go out again.
  - key: stone_statement
    title: Statement of Mr. Frederick Stone
    doc_type: Statement
    datetime: Wednesday, 3 June 1891
    author: Frederick Stone
    suspect: stone
    content: |
      Statement of Frederick Stone.

      I have not been inside Pemberton's workshop in over a year. I spent Tuesday evening at the Horological Society dinner in
      Clerkenwell Road, which began at seven and ended after ten. I did call at the shop at half past five and was refused.
  - key: mary_statement
    title: Statement of Miss Mary Collins
    doc_type: Statement
    datetime: Wednesday, 3 June 1891
    author: Mary Collins
    suspect: mary
    content: |
      Statement of Mary Collins.

      I locked the shop at seven o'clock and handed Mr. Pemberton his key, as I always do. After that I never touched his
      key again. The next I knew of the matter was when Constable Dyer called at my lodgings in Islington at ten.
  - key: finch_statement
    title: Statement of Captain Arthur Finch
    doc_type: Statement
    datetime: Wednesday, 3 June 1891
    author: Arthur Finch
    suspect: finch
    content: |
      Statement of Captain Arthur Finch.

      I collected my chronometer at ten past six and left. I never set foot in the workshop that day. At twenty past eight I
      returned to the shop door because the chronometer was losing. Mr. Pemberton spoke to me through the door. He said he
      could not attend me, as he was engaged with someone over the very matter he had refused an hour ago. I heard a
      woman's voice behind him.
