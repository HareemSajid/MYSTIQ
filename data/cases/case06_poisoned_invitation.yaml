hints:
  - >-
    Dr. Watson: "Consider opportunity. The cup was filled at nine and the toast was at five past. Who handled the cup in those
    five minutes, and who says they did not?"
  - >-
    Dr. Watson: "People describe one another differently: 'Mr. Hale' to Lady Margaret, 'the gentleman at the foot of the
    table' to Mr. Hale and the footman. Use the seating arrangement to learn who sat at the foot."
  - >-
    Dr. Watson: "Compare Mr. Mills's claim that he never left his chair with the service record at 9:02, Miss Clarke's
    account, and his telegram of Thursday."
solution:
  culprit: mills
  what: >-
    Edward Mills rose from the foot of the table, went to the sideboard while the loving cup stood unattended, and carried it to
    Sir Lucian — meaning he alone interfered with the host's cup, while denying he ever left his chair.
  when: Between 9:00 PM and 9:05 PM, between the filling of the cup and the toast.
  sequence:
    - "3 Dec, 4:15 PM — Mills telegraphs that Sir Lucian will sign nothing after Saturday and he will see to it personally."
    - "9:00 PM — Susan fills the cup and leaves it on the sideboard."
    - "9:02 PM — The footman notes the gentleman at the foot of the table (Mills) cross to the sideboard."
    - "9:03 PM — Susan returns; Mills carries the cup to Sir Lucian."
    - "9:05 PM — Sir Lucian drinks first at the toast."
    - "9:30 PM — Sir Lucian collapses."
  explanation: >-
    The seating plan places Mills at the foot of the table. Hale and the footman refer to 'the gentleman at the foot'; Susan
    names him as Mills; the service record notes the same gentleman at the sideboard at 9:02. Lady Margaret's naming of Hale is
    a mistaken identification by a distant witness, and Hale was seated beside Sir Lucian. Mills claimed he never rose and never
    went near the sideboard, contradicting three sources, and his telegram shows motive.
  insight: >-
    'The gentleman at the foot of the table' resolves to Mills through the seating arrangement; Lady Margaret's misidentification
    and Mills's denial are both contradicted by the footman and Susan.
  required_evidence: [seating, service_record, susan_statement, mills_statement, private_message]
  related_evidence: [schedule, hale_statement, margaret_statement, invitations, guest_list]
  concepts:
    - id: c1
      text: The gentleman at the foot of the table is Mills according to the seating arrangement, and the footman saw him cross to the sideboard at 9:02.
      keywords: [foot, seating, "9:02", sideboard, footman]
    - id: c2
      text: Mills claimed he never rose or went near the sideboard, contradicting Susan, Hale and the service record.
      keywords: [never rose, contradict, susan, hale, sideboard]
    - id: c3
      text: Lady Margaret mistook Hale for the gentleman who carried the cup because she sat far away; his telegram shows motive.
      keywords: [margaret, mistaken, telegram, motive, hale]
  what_options:
    - {id: a, text: "Mills left his seat at the foot of the table and carried the cup, which was left unattended at the sideboard.", correct: true}
    - {id: b, text: "Robert Hale tampered with the cup before the toast.", correct: false}
    - {id: c, text: "Susan Clarke altered the cup while polishing it at 8:55 PM.", correct: false}
    - {id: d, text: "Lady Margaret carried the cup to Sir Lucian herself.", correct: false}
  when_options:
    - {id: a, text: "Between 9:00 PM and 9:05 PM, before the toast.", correct: true}
    - {id: b, text: "At 7:50 PM when Mills arrived.", correct: false}
    - {id: c, text: "At 9:30 PM when Sir Lucian collapsed.", correct: false}
    - {id: d, text: "During the soup at 8:15 PM.", correct: false}
  insight_options:
    - {id: a, text: "The gentleman at the foot of the table is Mills; his denial is contradicted by Susan, Tilling's record and his own telegram, while Lady Margaret was mistaken about Hale.", correct: true}
    - {id: b, text: "Lady Margaret's arrival time proves she tampered with the cup.", correct: false}
    - {id: c, text: "Hale's debts prove he carried the cup.", correct: false}
    - {id: d, text: "Susan's absence in the kitchen proves she did it.", correct: false}
