hints:
  - >-
    Dr. Watson: "Beware, my friend: not every pair of statements describes the same day. Before you accuse William or
    Henry, ask which day each is speaking of."
  - >-
    Dr. Watson: "One suspect cites the striking of a clock as her alibi. Have a look at the clock inspection record — what
    could a stopped clock tell her, and what did it last strike?"
  - >-
    Dr. Watson: "Compare Miss Grey's account of leaving the library with the access log and the clock record. The window
    latch was sound on Friday, so the window must have been opened from within."
solution:
  culprit: grey
  what: >-
    Alice Grey remained hidden in the library alcove when it was locked at nine, bolted the door from inside, took the
    Psalter, and left through the east window, claiming a false alibi.
  when: Between 9:00 PM and about 9:50 PM on Saturday 18 April, after the library was locked.
  sequence:
    - "Thu 16 April — Moore sees Carter in the library at 9:20 PM (a different day; no contradiction)."
    - "Fri 17 April — Price re-sets and tests the east window latch."
    - "Sat 8:40 PM — Grey signs into the library; no exit is ever recorded."
    - "9:00 PM — Carter locks up, unaware that she is still inside."
    - "9:10 PM — The tower clock stops; it cannot strike again."
    - "About 9:45 PM — Grey leaves by the east window, leaving the note, with the door bolted inside."
    - "10:15 PM — The valet finds the door bolted; the Psalter is gone."
  explanation: >-
    Moore's sighting of Carter was on Thursday and so does not contradict Carter's Saturday account. Grey's alibi rests
    on hearing the tower clock strike ten, but the clock inspection record shows it stopped at 9:10 and could not strike.
    The access log shows her entering at 8:40 PM with no exit entered; Carter, who locked up at nine, did not see her
    in the hidden alcove. The window latch was sound on Friday, so the window was opened from the inside. The note is
    on estate-office paper.
  insight: >-
    The apparent Carter-Moore contradiction was a false lead (different days); the true contradiction is between Grey's
    claim of hearing the clock strike ten and the record showing it had stopped at 9:10.
  required_evidence: [grey_statement, clock_record, library_log, maintenance_record]
  related_evidence: [seating_plan, window_note, sequence, carter_statement, moore_statement, price_statement]
  concepts:
    - id: c1
      text: Grey claimed to hear the tower clock strike ten but the clock record shows it stopped at 9:10 and cannot strike.
      keywords: [clock, strike, ten, stopped, "9:10"]
    - id: c2
      text: The log shows Grey entered at 8:40 PM with no exit, and she stayed hidden in the alcove when Carter locked up.
      keywords: [log, "8:40", exit, alcove, hidden]
    - id: c3
      text: Moore saw Carter on Thursday, a different day, so it does not contradict Carter's Saturday statement.
      keywords: [thursday, different day, moore, carter, saturday]
  what_options:
    - {id: a, text: "Alice Grey hid in the alcove, bolted the door from inside, took the Psalter and left through the window.", correct: true}
    - {id: b, text: "William Carter locked the Psalter away and pretended it was stolen.", correct: false}
    - {id: c, text: "Samuel Price opened the window from outside while repairing the latch.", correct: false}
    - {id: d, text: "Dr. Moore remained in the library after twenty past eight and took the manuscript.", correct: false}
  when_options:
    - {id: a, text: "Between 9:00 PM and about 9:50 PM on Saturday, after the library was locked.", correct: true}
    - {id: b, text: "On Thursday evening at about 9:20 PM.", correct: false}
    - {id: c, text: "At 4:00 PM on Saturday when Miss Grey fetched the letters.", correct: false}
    - {id: d, text: "After 10:20 PM when the door was forced.", correct: false}
  insight_options:
    - {id: a, text: "Grey's claim to have heard the clock strike ten is impossible because the clock had stopped at 9:10.", correct: true}
    - {id: b, text: "Moore's 9:20 sighting proves Carter was lying about leaving at nine.", correct: false}
    - {id: c, text: "The window latch proves Price left it open.", correct: false}
    - {id: d, text: "The seating plan proves Moore hid in the alcove.", correct: false}
