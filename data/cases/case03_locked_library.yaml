  - {suspect: carter, doc: carter_statement, text: "I left at 9:00 PM and locked the door from the outside."}
  - {suspect: moore, doc: moore_statement, text: "On Thursday evening I saw William Carter inside the library at about twenty past nine, putting away the Psalter case."}
  - {suspect: grey, doc: grey_statement, text: "I left at once and returned to the estate office, where I wrote letters until after ten."}
